name: Emo Audio Tools (C++ DSP Plugins CI)

on:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'
      - 'docs/ROADMAP_EMO_AUDIO_TOOLS.md'
    branches:
      - main
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'

jobs:
  build-and-test:
    name: Build & Verify DSP Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (MidwestAmp)
        shell: bash
        run: |
          cd plugins/midwest-amp
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Compile DSP Test Runner
        shell: bash
        run: |
          cd plugins/midwest-amp
          cmake --build build --config Release

      - name: Run DSP Verification Tests
        shell: bash
        run: |
          cd plugins/midwest-amp/build
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./Release/test_midwest_amp.exe
          else
            ./test_midwest_amp
          fi
