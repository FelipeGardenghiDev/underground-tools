name: Emo Audio Tools (C++ DSP Plugins CI)

on:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'
      - 'docs/ROADMAP_EMO_AUDIO_TOOLS.md'
    branches:
      - main
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'

jobs:
  build-and-test:
    name: Build & Verify All 5 Plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. MidwestAmp
      - name: Configure CMake (MidwestAmp)
        run: cmake -S plugins/midwest-amp -B plugins/midwest-amp/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile MidwestAmp
        run: cmake --build plugins/midwest-amp/build --config Release

      - name: Run MidwestAmp Verification Tests
        run: ctest --test-dir plugins/midwest-amp/build -C Release --output-on-failure

      # 2. CryTune
      - name: Configure CMake (CryTune)
        run: cmake -S plugins/cry-tune -B plugins/cry-tune/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile CryTune
        run: cmake --build plugins/cry-tune/build --config Release

      - name: Run CryTune Verification Tests
        run: ctest --test-dir plugins/cry-tune/build -C Release --output-on-failure

      # 3. ScreamoPunch
      - name: Configure CMake (ScreamoPunch)
        run: cmake -S plugins/screamo-punch -B plugins/screamo-punch/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile ScreamoPunch
        run: cmake --build plugins/screamo-punch/build --config Release

      - name: Run ScreamoPunch Verification Tests
        run: ctest --test-dir plugins/screamo-punch/build -C Release --output-on-failure

      # 4. DrownSpace
      - name: Configure CMake (DrownSpace)
        run: cmake -S plugins/drown-space -B plugins/drown-space/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile DrownSpace
        run: cmake --build plugins/drown-space/build --config Release

      - name: Run DrownSpace Verification Tests
        run: ctest --test-dir plugins/drown-space/build -C Release --output-on-failure

      # 5. RawMaster
      - name: Configure CMake (RawMaster)
        run: cmake -S plugins/raw-master -B plugins/raw-master/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile RawMaster
        run: cmake --build plugins/raw-master/build --config Release

      - name: Run RawMaster Verification Tests
        run: ctest --test-dir plugins/raw-master/build -C Release --output-on-failure

      # 6. MidwestKit (VSTi Drum Synth)
      - name: Configure CMake (MidwestKit)
        run: cmake -S plugins/midwest-kit -B plugins/midwest-kit/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile MidwestKit
        run: cmake --build plugins/midwest-kit/build --config Release

      - name: Run MidwestKit Verification Tests
        run: ctest --test-dir plugins/midwest-kit/build -C Release --output-on-failure

      # 7. SadBoyUpright (VSTi Felt Piano Synth)
      - name: Configure CMake (SadBoyUpright)
        run: cmake -S plugins/sadboy-upright -B plugins/sadboy-upright/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile SadBoyUpright
        run: cmake --build plugins/sadboy-upright/build --config Release

      - name: Run SadBoyUpright Verification Tests
        run: ctest --test-dir plugins/sadboy-upright/build -C Release --output-on-failure

      # 8. GargantuaColossus (VSTi Drone Synth)
      - name: Configure CMake (GargantuaColossus)
        run: cmake -S plugins/gargantua-colossus -B plugins/gargantua-colossus/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile GargantuaColossus
        run: cmake --build plugins/gargantua-colossus/build --config Release

      - name: Run GargantuaColossus Verification Tests
        run: ctest --test-dir plugins/gargantua-colossus/build -C Release --output-on-failure

      # Upload Artifacts for All 5 CLAP Plugins
      - name: Upload Emo Audio Tools CLAP Suite Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmoAudioTools-CLAP-Suite-${{ matrix.os }}
          path: |
            plugins/midwest-amp/build/MidwestAmp.clap
            plugins/midwest-amp/build/Release/MidwestAmp.clap
            plugins/cry-tune/build/CryTune.clap
            plugins/cry-tune/build/Release/CryTune.clap
            plugins/screamo-punch/build/ScreamoPunch.clap
            plugins/screamo-punch/build/Release/ScreamoPunch.clap
            plugins/drown-space/build/DrownSpace.clap
            plugins/drown-space/build/Release/DrownSpace.clap
            plugins/raw-master/build/RawMaster.clap
            plugins/raw-master/build/Release/RawMaster.clap
          if-no-files-found: ignore
