<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#080808"/>
  <rect x="24" y="24" width="464" height="464" rx="48" fill="#121215" stroke="#facc15" stroke-width="12"/>
  
  <!-- Cassette Tape / Amp Body -->
  <rect x="76" y="110" width="360" height="230" rx="16" fill="#18181b" stroke="#e11d48" stroke-width="8"/>
  
