  <circle cx="180" cy="285" r="12" fill="#facc15"/>
  <circle cx="332" cy="285" r="32" fill="#080808" stroke="#ffffff" stroke-width="6"/>
  <circle cx="332" cy="285" r="12" fill="#facc15"/>
  
  <!-- Tape Window -->
