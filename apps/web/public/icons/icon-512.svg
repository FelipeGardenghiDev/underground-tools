  <text x="256" y="175" font-family="Courier New, monospace" font-size="22" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">UNDERGROUND TOOLS</text>
  <text x="256" y="200" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#e11d48" text-anchor="middle" letter-spacing="2">DIY STAGE &amp; TOUR SUITE</text>
  
  <!-- Spools -->
